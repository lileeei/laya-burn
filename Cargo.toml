[package]
name = "laya-burn"
version = "0.1.0"
edition = "2024"
description = "Run the Laya decision model (ModernBERT encoder + RLCD decision head) natively in Rust on the Burn tensor framework"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
burn = { version = "0.22", features = ["flex", "apple-amx", "metal", "autotune", "fusion"] }
burn-cubecl = "0.22"
cubecl = { version = "0.11", features = ["wgpu"] }
safetensors = "0.8"
tokenizers = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokenizers = { version = "0.23", default-features = false, features = ["unstable_wasm"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
