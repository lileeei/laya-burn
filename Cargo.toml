[package]
name = "laya-burn"
version = "0.1.0"
edition = "2024"
description = "Run the Laya decision model (ModernBERT encoder + RLCD decision head) natively in Rust on the Burn tensor framework"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
burn = { version = "0.22", features = ["flex", "apple-amx", "metal"] }
safetensors = "0.8"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
